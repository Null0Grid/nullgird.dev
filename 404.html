<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Null Grid</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<meta name="theme-color" content="#0a0a0f">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0a0a0f;--panel:#12141c;--line:#262a3a;--fg:#e4e8f2;--muted:#8b92a8;--cyan:#00e5ff;--pink:#ff2e88;--green:#39ff88;--on:#06080d;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg);color:var(--fg);font:16px/1.6 "IBM Plex Sans",system-ui,sans-serif;overflow-x:hidden;position:relative}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);z-index:3}
.floor{position:fixed;left:-50%;right:-50%;bottom:0;height:52vh;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,229,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.16) 1px,transparent 1px);
  background-size:64px 64px;transform:perspective(420px) rotateX(62deg);transform-origin:center top;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 40%);mask-image:linear-gradient(to bottom,transparent,#000 40%)}
.glow{position:fixed;left:50%;bottom:44vh;width:560px;height:260px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,46,136,.22),transparent);z-index:0;pointer-events:none}
header,main,footer{position:relative;z-index:2}
header{display:flex;align-items:center;gap:10px;padding:18px 24px}
header a{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;font:400 15px Silkscreen,monospace;letter-spacing:.08em}
header svg{flex:none}
main{display:grid;place-items:center;padding:24px 16px 120px}
.box{display:grid;gap:22px;justify-items:center;text-align:center;max-width:620px}
.eyebrow{font:500 13px "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--pink)}
h1{margin:0;font:400 clamp(72px,20vw,168px)/.95 Silkscreen,monospace;letter-spacing:.02em;position:relative}
h1 .sl{color:var(--cyan);text-shadow:0 0 22px rgba(255,46,136,.6)}
.term{position:relative;margin-top:34px}
.bot{position:absolute;right:-18px;top:-60px;width:84px;height:78px;pointer-events:none;filter:drop-shadow(0 0 8px rgba(0,229,255,.4))}
.bot .ang{opacity:0}
.bot svg{width:84px;height:78px;display:block;transform:scaleX(-1)}
@media (max-width:700px){.bot{right:10px}}
.g4{position:relative;display:inline-block;text-shadow:-3px 0 rgba(255,46,136,.75),3px 0 rgba(0,229,255,.6)}
.g4::before,.g4::after{content:attr(data-c);position:absolute;left:0;top:0;pointer-events:none}
.g4::before{color:var(--pink);transform:translate(-9px,0) skewX(-6deg);clip-path:inset(16% 0 58% 0);opacity:.95}
.g4::after{color:var(--cyan);transform:translate(10px,0);clip-path:inset(60% 0 16% 0);opacity:.9}
.g4.b{transform:translate(2px,-2px)}
.g4.b::before{transform:translate(11px,0);clip-path:inset(54% 0 26% 0)}
.g4.b::after{color:#5b1cff;transform:translate(-8px,0) skewX(5deg);clip-path:inset(8% 0 70% 0)}
h1::before,h1::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none;opacity:0}
h1::before{color:var(--pink);transform:translate(-4px,0)}
h1::after{color:#5b1cff;transform:translate(4px,0)}
@media (prefers-reduced-motion:no-preference){
  h1::before{animation:gl-a 4s steps(1) infinite}
  h1::after{animation:gl-b 4s steps(1) infinite}
  @keyframes gl-a{0%,88%,100%{opacity:0;clip-path:none}89%{opacity:.85;clip-path:inset(10% 0 60% 0)}91%{opacity:.85;clip-path:inset(55% 0 20% 0)}93%{opacity:0}}
  @keyframes gl-b{0%,88%,100%{opacity:0;clip-path:none}90%{opacity:.8;clip-path:inset(40% 0 35% 0)}92%{opacity:.8;clip-path:inset(5% 0 80% 0)}94%{opacity:0}}
  .g4::before{animation:j-a 2.6s steps(1) infinite}
  .g4::after{animation:j-b 3.1s steps(1) infinite}
  .g4.b::before{animation:j-b 2.9s steps(1) infinite reverse}
  .g4.b::after{animation:j-a 3.4s steps(1) infinite reverse}
  @keyframes j-a{0%{clip-path:inset(16% 0 58% 0)}22%{clip-path:inset(40% 0 38% 0);translate:-4px 0}47%{clip-path:inset(6% 0 76% 0)}71%{clip-path:inset(62% 0 12% 0);translate:5px 0}88%{clip-path:inset(28% 0 50% 0)}}
  @keyframes j-b{0%{clip-path:inset(60% 0 16% 0)}31%{clip-path:inset(20% 0 64% 0);translate:6px 0}58%{clip-path:inset(74% 0 6% 0)}80%{clip-path:inset(44% 0 30% 0);translate:-5px 0}}
  .bot .led{animation:blink 1.6s steps(1) infinite}
  .bot .eye{animation:eyes 5s steps(1) infinite}
  @keyframes eyes{0%,92%,100%{opacity:1}93%,96%{opacity:0}}
  .bot .swing{animation:swing 1.4s steps(2) infinite}
  @keyframes swing{0%,100%{transform:translateX(0)}50%{transform:translateX(1px)}}
  .bot{animation:shake 9s steps(1) infinite}
  .bot .ang{animation:ang 9s steps(1) infinite}
  .bot .calm{animation:calm 9s steps(1) infinite}
  .bot .puff{animation:puff .5s steps(1) infinite}
  @keyframes ang{0%,69%{opacity:0}70%,88%{opacity:1}89%,100%{opacity:0}}
  @keyframes calm{0%,69%{opacity:1}70%,88%{opacity:0}89%,100%{opacity:1}}
  @keyframes puff{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}
  @keyframes shake{0%,69%,89%,100%{translate:0 0}70%,74%,78%,82%,86%{translate:-2px 0}72%,76%,80%,84%,88%{translate:2px 0}}
  .bot .hand-r{animation:type .4s steps(1) infinite}
  @keyframes type{0%{transform:translateY(0)}50%{transform:translateY(.25px)}}
  .cur{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
}
.motto{margin:0;font:400 clamp(16px,2.6vw,22px)/1.2 Silkscreen,monospace;letter-spacing:.08em;text-transform:uppercase}
.motto b{font-weight:400;color:var(--pink);text-shadow:0 0 14px rgba(255,46,136,.55)}
.term{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font:14px/1.7 "JetBrains Mono",monospace;color:var(--muted);overflow-wrap:anywhere}
.term .p{color:var(--green)} .term .e{color:var(--pink)} .term .c{color:var(--cyan)}
.cur{display:inline-block;width:.6em;height:1.1em;background:var(--cyan);vertical-align:-.2em;margin-left:2px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:8px;font:600 15px "IBM Plex Sans",system-ui,sans-serif;text-decoration:none;border:1px solid var(--line);color:var(--fg);background:rgba(18,20,28,.85);transition:border-color .15s,color .15s,box-shadow .15s}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.main{background:var(--cyan);border-color:var(--cyan);color:var(--on)}
.btn.main:hover{color:var(--on);box-shadow:0 0 22px rgba(0,229,255,.4)}
.backup{margin:0;color:var(--muted);font-size:15px}
.backup a{color:var(--cyan);font-weight:600}
footer{padding:16px 24px;font:13px "JetBrains Mono",monospace;color:var(--muted);text-align:center}
</style></head>
<body>
<div class="floor" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>
<header><a href="/"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#08090c" stroke="#262a3a"/><path d="M14.5 6h3l-4 20h-3zM21.5 6h3l-4 20h-3z" fill="#00e8ff" style="filter:drop-shadow(0 0 2px #ff2e88)"/></svg>NULL GRID</a></header>
<main>
  <div class="box">
    <div class="eyebrow">ERROR 404 · NODE NOT FOUND</div>
    <h1 data-text="4//4"><span class="g4" data-c="4">4</span><span class="sl">//</span><span class="g4 b" data-c="4">4</span></h1>
    <p class="motto">That page isn't on the <b>grid</b>.</p>
    <div class="term" role="status">
      <div class="bot" aria-hidden="true"><svg viewBox="0 0 14 13" shape-rendering="crispEdges">
        <polygon points="2.9,8.5 2.2,5.2 6.4,4.4 7.2,7.4" fill="#00e5ff" opacity=".12"/>
        <rect class="led" x="9" y="0" width="1.5" height="1" fill="#ff2e88"/><rect x="9.5" y="1" width="0.5" height="1" fill="#8b92a8"/>
        <rect x="6" y="2" width="6" height="5" fill="#323c54"/><rect x="6" y="2" width="6" height="1" fill="#4a5677"/>
        <rect x="6" y="3" width="3" height="3" fill="#0b0e15"/><g class="calm"><g class="eye"><rect x="6.5" y="4.5" width="1" height="0.5" fill="#00e5ff"/></g></g>
        <g class="ang"><rect x="6.5" y="4.5" width="1" height="0.5" fill="#ff2e88"/><rect x="6.25" y="4" width="0.5" height="0.5" fill="#ff2e88"/><rect x="6.75" y="3.75" width="0.5" height="0.5" fill="#ff2e88"/><rect x="7.25" y="3.5" width="0.5" height="0.5" fill="#ff2e88"/>
          <rect x="9" y="0" width="1.5" height="1" fill="#ff3b4e"/>
          <g class="puff"><rect x="7" y="0.5" width="0.5" height="0.5" fill="#8b92a8"/><rect x="11.5" y="0.5" width="0.5" height="0.5" fill="#8b92a8"/><rect x="7.5" y="0" width="0.5" height="0.5" fill="#8b92a8"/><rect x="11" y="0" width="0.5" height="0.5" fill="#8b92a8"/></g>
          <rect x="13" y="0.5" width="0.5" height="1.5" fill="#ff2e88"/><rect x="13" y="2.5" width="0.5" height="0.5" fill="#ff2e88"/></g>
        <rect x="12" y="4" width="1" height="2" fill="#4a5677"/>
        <rect x="7" y="7" width="4" height="3" fill="#323c54"/><rect x="10" y="8" width="0.5" height="0.5" fill="#39ff88"/>
        <rect x="3.5" y="9" width="4.5" height="1" fill="#4a5677"/>
        
        <polygon points="1.5,8.5 2.1,8.5 1.5,5 0.9,5" fill="#4a5677"/>
        <polygon points="2.1,8.5 2.5,8.5 1.9,5 1.5,5" fill="#00e5ff"/>
        <rect x="1.5" y="8.5" width="5" height="0.5" fill="#8b92a8"/>
        <g class="hand-r"><rect x="4.5" y="7.75" width="3.5" height="0.75" fill="#4a5677"/></g>
      </svg></div>
      <div><span class="p">$</span> curl nullgrid.dev<span class="c" id="path">/this-page</span></div>
      <div><span class="e">404</span> no route to that page. It may have moved, or the link is wrong.</div>
      <div><span class="p">$</span> <span class="cur" aria-hidden="true"></span></div>
    </div>
    <div class="ctas">
      <a class="btn main" href="/">Back to Null Grid</a>
      <a class="btn" href="/downloads.html">Downloads</a>
    </div>
    <p class="backup">Site not loading right? Try the <a href="/backup.html">backup downloads page</a>.</p>
  </div>
</main>
<footer>Null Grid · Your data. Your grid.</footer>
<script>
try{var p=location.pathname;if(p&&p!=="/"){document.getElementById("path").textContent=p.length>60?p.slice(0,57)+"...":p}}catch(e){}
</script>
</body></html>
