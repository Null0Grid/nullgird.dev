<style>
:root{--bg:#0a0a0f;--panel:#0e1016;--line:#262a3a;--fg:#e4e8f2;--muted:#8b92a8;--cyan:#00e5ff;--pink:#ff2e88;--green:#39ff88;--amber:#ffb547;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "JetBrains Mono",ui-monospace,Consolas,monospace;display:flex;justify-content:center;padding:24px 16px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.win{width:min(980px,100%);height:calc(100vh - 48px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 0 40px rgba(0,229,255,.08);overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}
.bar i{width:11px;height:11px;border-radius:50%;background:#2b3446}.bar i:first-child{background:var(--pink)}
.bar span{margin-left:8px}
.bar a{margin-left:auto;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.bar a:hover{color:var(--cyan);border-color:var(--cyan)}
#out{flex:1;overflow-y:auto;padding:16px 18px 8px;white-space:pre-wrap;overflow-wrap:anywhere}
#out .ln{min-height:1.6em}
.big{font:400 clamp(28px,6vw,52px)/1.1 Silkscreen,monospace;letter-spacing:.04em;margin:6px 0}
.big b{font-weight:400;color:var(--cyan);text-shadow:0 0 16px rgba(255,46,136,.6)}
.c{color:var(--cyan)} .p{color:var(--pink)} .g{color:var(--green)} .m{color:var(--muted)} .a{color:var(--amber)} .w{color:var(--fg);font-weight:700}
button.opt{all:unset;cursor:pointer;display:inline}
button.opt:hover .k,button.opt:focus-visible .k{background:var(--cyan);color:#06080d}
button.opt:focus-visible{outline:1px dashed var(--cyan)}
.k{color:var(--cyan)}
.boot{display:flex;gap:16px;align-items:center}
.boot svg{width:56px;height:64px;flex:none;filter:drop-shadow(0 0 8px rgba(0,229,255,.4))}
.greet{display:flex;align-items:flex-end;gap:14px;margin:10px 0 4px}
.gbot{width:70px;height:80px;flex:none;filter:drop-shadow(0 0 8px rgba(0,229,255,.45))}
.gbot svg{width:70px;height:80px;display:block}
.bubble{position:relative;max-width:46ch;margin-bottom:34px;padding:10px 14px;border:1px solid var(--cyan);border-radius:10px;background:#12141c;white-space:normal}
.bubble::before{content:"";position:absolute;left:-7px;bottom:12px;width:12px;height:12px;background:#12141c;border-left:1px solid var(--cyan);border-bottom:1px solid var(--cyan);transform:rotate(45deg)}
.bubble b{display:block;color:var(--pink);font-weight:700;margin-bottom:2px}
@media (prefers-reduced-motion:no-preference){
  .gbot{animation:pop .5s steps(3) both}
  @keyframes pop{0%{transform:translateY(24px);opacity:0}60%{transform:translateY(-6px);opacity:1}100%{transform:none}}
  .gbot .arm{animation:wave .5s steps(1) 4;transform-box:fill-box;transform-origin:bottom}
  @keyframes wave{0%{transform:rotate(0)}50%{transform:rotate(18deg)}}
  .bubble{animation:fadein .3s .35s both}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}}
}
.inrow{display:flex;align-items:center;gap:8px;padding:10px 18px 14px;border-top:1px solid var(--line)}
.ps{white-space:nowrap}
#cmd{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;caret-color:var(--cyan)}
.hint{padding:0 18px 12px;color:var(--muted);font-size:12px}
@media (max-width:560px){body{padding:0}.win{height:100vh;border-radius:0;border:0}#out{padding:12px}.inrow{padding:10px 12px}.hint{padding:0 12px 10px}}
</style>
