<style>
:root{--bg:#0a0a0f;--panel:#0e1016;--line:#262a3a;--fg:#e4e8f2;--muted:#8b92a8;--cyan:#00e5ff;--pink:#ff2e88;--green:#39ff88;--amber:#ffb547;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "JetBrains Mono",ui-monospace,Consolas,monospace;display:flex;justify-content:center;padding:24px 16px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.win{width:min(980px,100%);height:calc(100vh - 48px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 0 40px rgba(0,229,255,.08);overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}
.bar i{width:11px;height:11px;border-radius:50%;background:#2b3446}.bar i:first-child{background:var(--pink)}
.bar span{margin-left:8px}
.bar a{margin-left:auto;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.bar a:hover{color:var(--cyan);border-color:var(--cyan)}
#out{flex:1;overflow-y:auto;padding:16px 18px 8px;white-space:pre-wrap;overflow-wrap:anywhere}
#out .ln{min-height:1.6em}
.big{font:400 clamp(28px,6vw,52px)/1.1 Silkscreen,monospace;letter-spacing:.04em;margin:6px 0}
.big b{font-weight:400;color:var(--cyan);text-shadow:0 0 16px rgba(255,46,136,.6)}
.c{color:var(--cyan)} .p{color:var(--pink)} .g{color:var(--green)} .m{color:var(--muted)} .a{color:var(--amber)} .w{color:var(--fg);font-weight:700}
button.opt{all:unset;cursor:pointer;display:inline}
button.opt:hover .k,button.opt:focus-visible .k{background:var(--cyan);color:#06080d}
button.opt:focus-visible{outline:1px dashed var(--cyan)}
.k{color:var(--cyan)}
.boot{display:flex;gap:16px;align-items:center}
.boot svg{width:56px;height:64px;flex:none;filter:drop-shadow(0 0 8px rgba(0,229,255,.4))}
.greet{display:flex;align-items:flex-end;gap:14px;margin:10px 0 4px}
.gbot{width:70px;height:80px;flex:none;filter:drop-shadow(0 0 8px rgba(0,229,255,.45))}
.gbot svg{width:70px;height:80px;display:block}
.bubble{position:relative;max-width:46ch;margin-bottom:34px;padding:10px 14px;border:1px solid var(--cyan);border-radius:10px;background:#12141c;white-space:normal}
.bubble::before{content:"";position:absolute;left:-7px;bottom:12px;width:12px;height:12px;background:#12141c;border-left:1px solid var(--cyan);border-bottom:1px solid var(--cyan);transform:rotate(45deg)}
.bubble b{display:block;color:var(--pink);font-weight:700;margin-bottom:2px}
@media (prefers-reduced-motion:no-preference){
  .gbot{animation:pop .5s steps(3) both}
  @keyframes pop{0%{transform:translateY(24px);opacity:0}60%{transform:translateY(-6px);opacity:1}100%{transform:none}}
  .gbot .arm{animation:wave .5s steps(1) 4;transform-box:fill-box;transform-origin:bottom}
  @keyframes wave{0%{transform:rotate(0)}50%{transform:rotate(18deg)}}
  .bubble{animation:fadein .3s .35s both}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}}
}
.inrow{display:flex;align-items:center;gap:8px;padding:10px 18px 14px;border-top:1px solid var(--line)}
.ps{white-space:nowrap}
#cmd{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;caret-color:var(--cyan)}
.hint{padding:0 18px 12px;color:var(--muted);font-size:12px}
@media (max-width:560px){body{padding:0}.win{height:100vh;border-radius:0;border:0}#out{padding:12px}.inrow{padding:10px 12px}.hint{padding:0 12px 10px}}
</style>
</head>

    opt(ii + 1, it.label.padEnd(34), rest);
  });
  line({ c: "m", t: "[b] back" });
}
function showFile(ii) {
  const it = st.app.groups[st.group].items[ii]; st.view = "file"; st.file = it; setCwd();
  blank(); line({ c: "c", t: it.label });
  if (it.store) { line({ c: "m", t: "Installs and updates through the Microsoft Store." }); blank(); opt("d", "Open the Microsoft Store"); line({ c: "m", t: "[b] back" }); return; }
  if (it.file) {
    line([{ c: "m", t: "file    " }, it.file]);
    if (it.size) line([{ c: "m", t: "size    " }, mb(it.size)]);
    if (it.sha) line([{ c: "m", t: "sha256  " }, { c: "g", t: it.sha }]);
  }
  if (it.missing) { line({ c: "a", t: "This file isn't on the GitHub release yet." }); line({ c: "m", t: "[b] back" }); return; }
  if (it.cmd) { blank(); line({ c: "m", t: it.file ? "# after it downloads:" : (it.hint || "# run this:") }); line([{ c: "g", t: "$ " }, it.cmd]); }
  blank();
  if (it.file) opt("d", "Download");
  if (it.cmd) opt("c", "Copy the command");
  line({ c: "m", t: "[b] back · [m] menu" });
}
function back() {
  if (st.view === "file") showGroup(st.group);
  else if (st.view === "group") showApp(st.ai);
  else home();
}
function copy(t) {
  const ok = () => line({ c: "g", t: "copied to clipboard" });
  try { navigator.clipboard.writeText(t).then(ok, () => line({ c: "a", t: "couldn't copy. Select the command above instead." })); } catch (e) { line({ c: "a", t: "couldn't copy. Select the command above instead." }); }
}
const HELLOS = ["Hi! I'm Packet. I keep your data on your grid.", "Hey there. Need a download? Type m for the menu.", "Hi! Everything here runs on hardware you own. Not on my grid otherwise.", "Oh, hello. I was just checking your files. They're fine."];
let hello = 0;
function greet() {
  const g = el("div", "greet"); const bot = el("div", "gbot"); bot.innerHTML = WAVE;
  const bub = el("div", "bubble"); bub.append(el("b", null, "Packet"), el("span", null, HELLOS[hello++ % HELLOS.length]));
  g.append(bot, bub); out.append(g); out.scrollTop = out.scrollHeight;
}
function help() {
  blank(); line({ c: "w", t: "commands" });
  [["<number>", "pick an option"], ["b, back", "go up one level"], ["m, menu, home", "back to the program list"], ["d", "download the file you're looking at"], ["c", "copy its command"], ["ls", "list options again"], ["clear", "clear the screen"], ["gui", "open the normal downloads page"], ["hi, packet", "say hi to Packet"]]
    .forEach(([a, b]) => line([{ c: "c", t: a.padEnd(16) }, { c: "m", t: b }]));
}
function relist() {
  if (st.view === "home") home(); else if (st.view === "app") showApp(st.ai); else if (st.view === "group") showGroup(st.group); else showFile(st.app.groups[st.group].items.indexOf(st.file));
}
function run(raw) {
  const v = raw.trim(); const low = v.toLowerCase();
  line([{ c: "g", t: "packet@nullgrid" }, { c: "m", t: ":" }, { c: "c", t: path() }, { c: "m", t: "$ " }, v]);
  if (v) { hist.push(v); hi = hist.length; }
  if (!v) return;
  if (["b", "back", "..", "cd .."].includes(low)) return back();
  if (["m", "menu", "home", "~", "cd", "cd ~"].includes(low)) return home();
  if (["help", "?", "h"].includes(low)) return help();
  if (low === "clear" || low === "cls") { out.textContent = ""; return relist(); }
  if (low === "ls" || low === "dir") return relist();
  if (low === "gui" || low === "exit" || low === "q") { location.href = "/downloads.html"; return; }
  if (["packet", "hi", "hello", "hey", "hi packet", "hey packet", "hello packet"].includes(low)) return greet();
  if (low === "sudo" || low.startsWith("sudo ")) { line({ c: "p", t: "Nice try. You're already in charge here." }); return; }
  const n = parseInt(v, 10);
  if (st.view === "home" && n >= 1 && n <= APPS.length) return showApp(n - 1);
  if (st.view === "app") {
    if (st.app.web && n === 1) { line({ c: "m", t: "opening " + st.app.web + " ..." }); window.open(st.app.web, "_blank", "noopener"); return; }
    if (st.app.groups && n >= 1 && n <= st.app.groups.length) return showGroup(n - 1);
  }
  if (st.view === "group") { const items = st.app.groups[st.group].items; if (n >= 1 && n <= items.length) return showFile(n - 1); }
  if (st.view === "file") {
    const it = st.file;
    if (low === "d" || low === "download") {
      if (it.store) { line({ c: "m", t: "opening the Microsoft Store ..." }); window.open(it.store, "_blank", "noopener"); return; }
      if (it.file && !it.missing) { line({ c: "g", t: "downloading " + it.file + " ..." }); const a = document.createElement("a"); a.href = it.url; a.rel = "noopener"; document.body.append(a); a.click(); a.remove(); return; }
    }
    if ((low === "c" || low === "copy") && it.cmd) return copy(it.cmd);
  }
  line({ c: "a", t: "command not found: " + v + "  (type help)" });
}
cmd.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); const v = cmd.value; cmd.value = ""; run(v); }
  else if (e.key === "ArrowUp" && hist.length) { e.preventDefault(); hi = Math.max(0, hi - 1); cmd.value = hist[hi]; }
  else if (e.key === "ArrowDown") { e.preventDefault(); hi = Math.min(hist.length, hi + 1); cmd.value = hist[hi] || ""; }
  else if (e.key === "Escape") { e.preventDefault(); cmd.value = ""; back(); }
});
out.addEventListener("click", e => { if (!e.target.closest("button") && !getSelection().toString()) cmd.focus(); });

(function boot() {
  const b = el("div", "boot"); b.innerHTML = PACKET;
  const t = el("div"); const h = el("div", "big"); h.innerHTML = "NULL<b>//</b>GRID"; t.append(h, el("div", "m", "downloads terminal · release 5.1"));
  b.append(t); out.append(b);
  const msgs = [["g", "[ ok ] network up"], ["g", "[ ok ] mounted ~/downloads"], ["g", "[ ok ] 5 programs found"]];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let i = 0;
  (function next() {
    if (i < msgs.length) { line({ c: msgs[i][0], t: msgs[i][1] }); i++; setTimeout(next, reduce ? 0 : 160); }
    else { home(); cmd.focus(); }
  })();
})();
</script>
