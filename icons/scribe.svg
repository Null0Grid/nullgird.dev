<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs>
    <filter id="s-pink" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="s-cyan" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="s-edge" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="n-sq" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feFlood flood-color="#00e5ff" flood-opacity=".75"/>
      <feComposite operator="in" in2="SourceAlpha"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="n-sl" x="-100%" y="-30%" width="300%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="b3"/><feFlood flood-color="#8c1446" flood-opacity=".65"/><feComposite operator="in" in2="b3" result="g3"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="b2"/><feFlood flood-color="#ff2e88" flood-opacity=".75"/><feComposite operator="in" in2="b2" result="g2"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="b1"/><feFlood flood-color="#96beff" flood-opacity=".9"/><feComposite operator="in" in2="b1" result="g1"/>
      <feMerge><feMergeNode in="g3"/><feMergeNode in="g2"/><feMergeNode in="g1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile1024"><rect width="1024" height="1024" rx="224"/></clipPath>
    <filter id="sc-wave" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feFlood flood-color="#ff2e88" flood-opacity=".55"/><feComposite operator="in" in2="SourceAlpha"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sc-led" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
    <g clip-path="url(#tile1024)">
      <rect width="1024" height="1024" fill="#08090c"/>
      <path d="M196 216 H828 a56 56 0 0 1 56 56 V654 a56 56 0 0 1 -56 56 H404 L276 816 V710 H196 a56 56 0 0 1 -56 -56 V272 a56 56 0 0 1 56 -56 Z" fill="none" stroke="#00e5ff" stroke-width="22" stroke-linejoin="round" filter="url(#n-sq)"/>
      <polygon points="318,292 384,292 314,634 248,634" fill="#00e8ff" filter="url(#n-sl)"/>
      <polygon points="452,292 518,292 448,634 382,634" fill="#00e8ff" filter="url(#n-sl)"/>
      <g stroke="#ff2e88" stroke-width="30" stroke-linecap="round" filter="url(#sc-wave)">
        <line x1="588" y1="418" x2="588" y2="508"/><line x1="648" y1="350" x2="648" y2="576"/><line x1="708" y1="396" x2="708" y2="530"/><line x1="768" y1="438" x2="768" y2="488"/>
      </g>
      <circle cx="790" cy="640" r="20" fill="#39ff88" filter="url(#sc-led)"/>
      <rect x="610" y="628" width="140" height="24" rx="8" fill="#1f2a33"/>
